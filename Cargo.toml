[package]
name = "rTunnel"
version = "0.1.4"
edition = "2024"

[dependencies]
auto-launcher = "1.1.0"
base64 = "0.22.1"
dirs = "6"
keyring = "4.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.17.1"
# TODO(SECURITY): Monitor ssh2 crate for releases > 0.9.6 that include patched libssh2 (CVE-2026-55200, etc.)
ssh2 = "0.9.6"
uuid = { version = "1.25.0", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1.12"
