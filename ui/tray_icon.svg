<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#14151e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="64" fill="url(#bg-grad)" stroke="#2E3044" stroke-width="2"/>
  
  <g transform="translate(64, 64) scale(5.333)">
    <!-- Base connections -->
    <path d="M 12 12 L 12 4 M 12 12 L 4 10 M 12 12 L 7 20 M 12 12 L 19 16 M 12 4 L 4 10 M 4 10 L 7 20 M 7 20 L 19 16 M 12 4 L 19 16" 
          stroke="#3EADFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Central node -->
    <circle cx="12" cy="12" r="4.5" fill="#14151e" stroke="#3EADFF" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Outer nodes -->
    <circle cx="12" cy="4" r="2.5" fill="#14151e" stroke="#3EADFF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="4" cy="10" r="2.5" fill="#14151e" stroke="#3EADFF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="7" cy="20" r="2.5" fill="#14151e" stroke="#3EADFF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="19" cy="16" r="2.5" fill="#14151e" stroke="#3EADFF" stroke-width="1.2" filter="url(#glow)"/>
  </g>
</svg>
